<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SkillSphere Payment</title>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<style>

body{

    font-family:Arial,Helvetica,sans-serif;

    background:#f5f5f5;

    display:flex;

    justify-content:center;

    align-items:center;

    height:100vh;

}

.container{

    background:white;

    padding:30px;

    border-radius:10px;

    width:450px;

    box-shadow:0 0 10px rgba(0,0,0,0.2);

}

input{

    width:100%;

    padding:10px;

    margin-top:10px;

}

button{

    width:100%;

    padding:12px;

    margin-top:20px;

    background:#1976d2;

    color:white;

    border:none;

    cursor:pointer;

    font-size:16px;

}

button:hover{

    background:#1258a7;

}

#result{

    margin-top:20px;

    word-break:break-word;

}

</style>

</head>

<body>

<div class="container">

<h2>💳 SkillSphere Payment</h2>

<input
id="token"
placeholder="JWT Token"
value="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6IjZhNTg5ZWI0NjQ0ZGYzNTIzOGM1Njg5NiIsInJvbGUiOiJjbGllbnQiLCJpYXQiOjE3ODQxOTI2OTYsImV4cCI6MTc4NDc5NzQ5Nn0.b7yNcsjoyPN1yWHVUskkC-mgslyv7gFxQDwUlcpujxc"
/>

<input
id="projectId"
placeholder="Project ID"
value="6a4e34c9a2287e1d33c6b044"
/>

<input
id="amount"
type="number"
placeholder="Amount"
value="50000"
/>

<button onclick="payNow()">

Pay Now

</button>

<div id="result"></div>

</div>

<script>

async function payNow(){

    const token=
    document.getElementById("token").value;

    const projectId=
    document.getElementById("projectId").value;

    const amount=
    document.getElementById("amount").value;

    try{

        const response=await fetch(

            "http://localhost:5000/api/payments/create-order",

            {

                method:"POST",

                headers:{

                    "Content-Type":"application/json",

                    Authorization:`Bearer ${token}`,

                },

                body:JSON.stringify({

                    projectId,

                    amount,

                }),

            }

        );

        const data=await response.json();

        console.log(data);

        if(!data.success){

            alert(data.message);

            return;

        }

        const options={

            key:"rzp_test_TEDMlmrX9jfV3Y",

            amount:data.order.amount,

            currency:data.order.currency,

            name:"SkillSphere",

            description:"Project Escrow Payment",

            order_id:data.order.id,

            handler:async function(response){

                const verify=await fetch(

                    "http://localhost:5000/api/payments/verify",

                    {

                        method:"POST",

                        headers:{

                            "Content-Type":"application/json",

                            Authorization:`Bearer ${token}`,

                        },

                        body:JSON.stringify(response),

                    }

                );

                const verifyData=await verify.json();

                document.getElementById("result").innerHTML=

                "<pre>"+JSON.stringify(verifyData,null,4)+"</pre>";

                alert("✅ Payment Successful");

            },

            theme:{

                color:"#1976d2"

            }

        };

        const rzp=new Razorpay(options);

        rzp.open();

    }

    catch(err){

        console.log(err);

        alert("Payment Failed");

    }

}

</script>

</body>
</html>
